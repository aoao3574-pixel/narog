<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI-schedule</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f6f5f1;
      --card: #ffffff;
      --text: #1c1b18;
      --muted: #6f6b62;
      --line: #e4e1d8;
      --accent: #0f766e;
      --accent-text: #ffffff;
      --danger: #b42318;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141413;
        --card: #1f1e1c;
        --text: #f1efe9;
        --muted: #a39f94;
        --line: #33312d;
        --accent: #2dd4bf;
        --accent-text: #06201d;
        --danger: #f97066;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }
    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px calc(40px + env(safe-area-inset-bottom));
    }
    h1 { font-size: 22px; margin: 0; letter-spacing: -0.02em; }
    h2 { font-size: 16px; margin: 0 0 4px; }
    p { margin: 0; }
    .muted { color: var(--muted); font-size: 14px; }
    .center { text-align: center; padding-top: 30vh; }
    .login { padding-top: 22vh; text-align: center; }
    .login h1 { font-size: 28px; margin-bottom: 8px; }
    .login .muted { margin-bottom: 32px; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px 16px;
      margin-bottom: 14px;
    }
    .card > .muted { margin-bottom: 14px; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-top: 1px solid var(--line);
    }
    .row:first-of-type { border-top: 0; }
    .row label { flex: 1; }
    input[type="number"], input[type="time"] {
      font: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      min-height: 42px;
      width: 128px;
      text-align: right;
    }
    input.wide {
      font: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 12px;
      min-height: 46px;
      width: 100%;
      margin-bottom: 10px;
    }
    #token-box { margin-top: 12px; }
    input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); }
    .unit { display: flex; align-items: center; gap: 8px; }
    .unit input { width: 84px; }
    button {
      font: inherit;
      border: 0;
      border-radius: 12px;
      min-height: 48px;
      padding: 0 18px;
      cursor: pointer;
    }
    .primary { background: var(--accent); color: var(--accent-text); font-weight: 600; width: 100%; }
    .primary:disabled { opacity: 0.6; }
    .ghost { background: transparent; color: var(--muted); min-height: 40px; padding: 0 8px; font-size: 14px; }
    .status { min-height: 22px; margin-top: 10px; text-align: center; font-size: 14px; color: var(--muted); }
    .status.error { color: var(--danger); }
  </style>
</head>
<body>
  <main>
    <!-- 1) 불러오는 중 -->
    <section id="view-loading" class="center muted">불러오는 중…</section>

    <!-- 2) 로그인 화면 -->
    <section id="view-login" class="login" hidden>
      <h1>AI-schedule</h1>
      <p class="muted">한 줄만 적으면 일정과 알림이 등록돼요</p>
      <button id="btn-login" class="primary">Google로 로그인</button>
      <p id="login-status" class="status"></p>
    </section>

    <!-- 3) 설정 화면 -->
    <section id="view-app" hidden>
      <div class="topbar">
        <div>
          <h1>설정</h1>
          <p id="user-email" class="muted"></p>
        </div>
        <button id="btn-logout" class="ghost">로그아웃</button>
      </div>

      <form id="settings-form">
        <div class="card">
          <h2>알림 시점</h2>
          <p class="muted">AI가 알림 시각을 정할 때 이 규칙을 따라요</p>
          <div class="row">
            <label for="lead_minutes">시간이 있는 일정</label>
            <span class="unit"><input id="lead_minutes" type="number" min="0" max="1440" step="5" inputmode="numeric" required> 분 전</span>
          </div>
          <div class="row">
            <label for="untimed_alert_time">시간이 없는 일정 (당일)</label>
            <input id="untimed_alert_time" type="time" required>
          </div>
        </div>

        <div class="card">
          <h2>애매한 표현</h2>
          <p class="muted">"저녁에 운동"처럼 적으면 아래 시각으로 등록해요</p>
          <div class="row"><label for="morning_time">아침</label><input id="morning_time" type="time" required></div>
          <div class="row"><label for="noon_time">점심</label><input id="noon_time" type="time" required></div>
          <div class="row"><label for="evening_time">저녁</label><input id="evening_time" type="time" required></div>
          <div class="row"><label for="night_time">밤</label><input id="night_time" type="time" required></div>
        </div>

        <div class="card">
          <h2>알림 금지 시간대</h2>
          <p class="muted">이 시간에 걸리는 알림은 시작 시각 직전으로 당겨요</p>
          <div class="row">
            <label for="quiet_on">사용</label>
            <input id="quiet_on" type="checkbox">
          </div>
          <div id="quiet-fields" hidden>
            <div class="row"><label for="quiet_start">시작</label><input id="quiet_start" type="time"></div>
            <div class="row"><label for="quiet_end">끝</label><input id="quiet_end" type="time"></div>
          </div>
        </div>

        <button id="btn-save" class="primary" type="submit">저장</button>
        <p id="save-status" class="status"></p>
      </form>

      <div class="card" style="margin-top: 22px;">
        <h2>한 줄 입력 테스트</h2>
        <p class="muted">단축어를 만들기 전에 여기서 먼저 확인해요</p>
        <input id="test-text" class="wide" type="text" placeholder="예: 내일 15시 회의" maxlength="500" autocomplete="off">
        <button id="btn-test" class="primary" type="button">보내기</button>
        <p id="test-status" class="status"></p>
      </div>

      <div class="card">
        <h2>단축어 연결</h2>
        <p class="muted">단축어가 "나"임을 증명하는 열쇠예요. 새로 발급하면 이전 것은 못 써요</p>
        <button id="btn-token" class="primary" type="button">토큰 발급</button>
        <div id="token-box" hidden>
          <input id="token-value" class="wide" type="text" readonly>
          <button id="btn-copy" class="ghost" type="button">복사</button>
          <p class="muted">지금만 보여요. 복사해서 단축어에 넣어 주세요</p>
        </div>
        <p id="token-status" class="status"></p>
      </div>
    </section>
  </main>

  <script>
    // 공개용 값: 웹페이지에 들어가도 되는 주소와 키. 데이터는 DB의 RLS 규칙이 지킴.
    const SUPABASE_URL = 'https://vspjflkjlzdsqgccetcu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_gLb0GeDp2S1pBJ7l8eDHDw_WcTjBA-D';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const $ = (id) => document.getElementById(id);
    const views = ['view-loading', 'view-login', 'view-app'];
    const timeFields = ['untimed_alert_time', 'morning_time', 'noon_time', 'evening_time', 'night_time'];
    let currentUserId = null;

    function show(viewId) {
      views.forEach((id) => { $(id).hidden = id !== viewId; });
    }

    function setStatus(el, message, isError) {
      el.textContent = message;
      el.classList.toggle('error', Boolean(isError));
    }

    // DB의 시간값은 "08:00:00" 형태라서 입력칸에 맞게 "08:00"으로 자름
    const toInput = (value) => (value ? String(value).slice(0, 5) : '');

    // ---------- 로그인 / 로그아웃 ----------
    $('btn-login').addEventListener('click', async () => {
      setStatus($('login-status'), '구글 로그인 화면으로 이동 중…');
      const { error } = await db.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin },
      });
      if (error) setStatus($('login-status'), '로그인을 시작하지 못했어요: ' + error.message, true);
    });

    $('btn-logout').addEventListener('click', async () => {
      await db.auth.signOut();
    });

    // 로그인 상태가 바뀔 때마다 호출됨 (첫 접속, 로그인, 로그아웃)
    db.auth.onAuthStateChange((event, session) => {
      const user = session ? session.user : null;
      if (!user) {
        currentUserId = null;
        show('view-login');
        return;
      }
      if (user.id === currentUserId) return; // 같은 사용자의 토큰 갱신이면 다시 불러오지 않음
      currentUserId = user.id;
      $('user-email').textContent = user.email || '';
      // 이 콜백 안에서 바로 DB를 부르면 멈추는 경우가 있어 한 박자 늦춰 실행
      setTimeout(() => loadSettings(user.id), 0);
    });

    // ---------- 설정 불러오기 ----------
    async function loadSettings(userId) {
      show('view-loading');
      let { data, error } = await db.from('settings').select('*').eq('user_id', userId).maybeSingle();

      // 처음 로그인한 사용자: 기본값으로 한 줄 만들기
      if (!error && !data) {
        ({ data, error } = await db.from('settings').insert({ user_id: userId }).select().single());
      }

      show('view-app');
      if (error) {
        setStatus($('save-status'), '설정을 불러오지 못했어요: ' + error.message, true);
        return;
      }
      fillForm(data);
    }

    function fillForm(s) {
      $('lead_minutes').value = s.lead_minutes;
      timeFields.forEach((f) => { $(f).value = toInput(s[f]); });
      const quietOn = Boolean(s.quiet_start && s.quiet_end);
      $('quiet_on').checked = quietOn;
      $('quiet-fields').hidden = !quietOn;
      $('quiet_start').value = toInput(s.quiet_start);
      $('quiet_end').value = toInput(s.quiet_end);
    }

    $('quiet_on').addEventListener('change', (e) => {
      $('quiet-fields').hidden = !e.target.checked;
    });

    // ---------- 설정 저장 ----------
    $('settings-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUserId) return;
      const status = $('save-status');

      const quietOn = $('quiet_on').checked;
      const quietStart = $('quiet_start').value;
      const quietEnd = $('quiet_end').value;
      if (quietOn && (!quietStart || !quietEnd)) {
        setStatus(status, '알림 금지 시간대의 시작과 끝을 모두 입력해 주세요', true);
        return;
      }

      const values = {
        lead_minutes: Number($('lead_minutes').value),
        quiet_start: quietOn ? quietStart : null,
        quiet_end: quietOn ? quietEnd : null,
        updated_at: new Date().toISOString(),
      };
      timeFields.forEach((f) => { values[f] = $(f).value; });

      $('btn-save').disabled = true;
      setStatus(status, '저장 중…');
      const { error } = await db.from('settings').update(values).eq('user_id', currentUserId);
      $('btn-save').disabled = false;

      if (error) setStatus(status, '저장하지 못했어요: ' + error.message, true);
      else setStatus(status, '저장했어요');
    });

    // ---------- 서버 함수 호출 (로그인 증표를 같이 보냄) ----------
    async function callApi(path, body) {
      const { data } = await db.auth.getSession();
      const jwt = data && data.session ? data.session.access_token : '';
      const res = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + jwt },
        body: JSON.stringify(body || {}),
      });
      let json = null;
      try { json = await res.json(); } catch (e) { json = null; }
      if (!json) throw new Error('서버 응답을 읽지 못했어요 (' + res.status + ')');
      return json;
    }

    // ---------- 한 줄 입력 테스트 ----------
    async function sendTest() {
      const status = $('test-status');
      const text = $('test-text').value.trim();
      if (!text) { setStatus(status, '내용을 적어 주세요', true); return; }
      $('btn-test').disabled = true;
      setStatus(status, 'AI가 읽는 중…');
      try {
        const r = await callApi('/api/add', { text });
        setStatus(status, r.message || r.error || '응답이 비어 있어요', r.status !== 'saved');
        if (r.status === 'saved') $('test-text').value = '';
      } catch (e) {
        setStatus(status, e.message, true);
      }
      $('btn-test').disabled = false;
    }
    $('btn-test').addEventListener('click', sendTest);
    $('test-text').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); sendTest(); }
    });

    // ---------- 단축어 토큰 ----------
    $('btn-token').addEventListener('click', async () => {
      const status = $('token-status');
      $('btn-token').disabled = true;
      setStatus(status, '발급 중…');
      try {
        const r = await callApi('/api/token');
        if (r.token) {
          $('token-value').value = r.token;
          $('token-box').hidden = false;
          setStatus(status, '');
        } else {
          setStatus(status, r.error || '발급하지 못했어요', true);
        }
      } catch (e) {
        setStatus(status, e.message, true);
      }
      $('btn-token').disabled = false;
    });

    $('btn-copy').addEventListener('click', async () => {
      const value = $('token-value').value;
      try {
        await navigator.clipboard.writeText(value);
        setStatus($('token-status'), '복사했어요');
      } catch (e) {
        $('token-value').select();
        setStatus($('token-status'), '길게 눌러 직접 복사해 주세요');
      }
    });
  </script>
</body>
</html>
